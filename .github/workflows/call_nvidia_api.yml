name: Trigger NVIDIA NIM API (GLM-5.3)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instrucción o tarea de código para z-ai/glm-5-3'
        required: true
        default: 'Escribe una función modular para gestionar hilos de inferencia local.'

jobs:
  execute-glm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Call NVIDIA API with z-ai/glm-5-3
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -c "
          import os, requests, json
          from glm_coder_instructions import NVIDIA_CHAT_ENDPOINT, get_payload

          api_key = os.getenv('NVIDIA_API_KEY')
          if not api_key:
              print('❌ Error: Configura NVIDIA_API_KEY en los Secrets del repositorio.')
              exit(1)

          prompt = '${{ github.event.inputs.prompt }}'
          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json'
          }
          
          payload = get_payload(prompt)
          print(f'🚀 Enviando petición a z-ai/glm-5-3...')
          
          response = requests.post(NVIDIA_CHAT_ENDPOINT, headers=headers, json=payload)
          
          if response.status_code == 200:
              res_data = response.json()
              print('\n--- [ CÓDIGO GENERADO POR GLM-5.3 ] ---\n')
              print(res_data['choices'][0]['message']['content'])
          else:
              print(f'❌ Error {response.status_code}: {response.text}')
          "
